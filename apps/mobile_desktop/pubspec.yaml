name: jiangjiu_mobile_desktop
description: Jiangjiu internal mobile and Windows client UI prototype.
version: 0.2.0+1
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.2
  flutter_secure_storage: ^10.3.1
  jiangjiu_shared:
    path: ../../packages/shared
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/jiangjiu-app-logo-gold.png
